[package]
name = "hc-svd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Haplotype components (HCs) from a combined chunk-length matrix: randomised SVD of log10(matrix + 1), with sample subsets, relative removal, reweighting and projection"

[[bin]]
name = "hcsvd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "linalg"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rayon = "1.12.0"

[profile.release]
debug = false
